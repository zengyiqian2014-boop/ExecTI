name: release

# Build both Windows architectures and publish them as a GitHub Release.
# Trigger by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# Or run manually from the Actions tab (workflow_dispatch) with a tag name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (x86_64 toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Install llvm-mingw (ARM64 toolchain)
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20250528/llvm-mingw-20250528-ucrt-ubuntu-22.04-x86_64.tar.xz
          sudo tar -C /opt -xf /tmp/llvm-mingw.tar.xz
          sudo mv /opt/llvm-mingw-* /opt/llvm-mingw
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build both architectures
        run: make all

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp build/x86_64/execti.exe dist/execti-x86_64.exe
          cp build/arm64/execti.exe  dist/execti-arm64.exe
          cd dist
          sha256sum execti-x86_64.exe execti-arm64.exe > SHA256SUMS.txt
          zip execti-windows-x64-arm64.zip execti-x86_64.exe execti-arm64.exe SHA256SUMS.txt
          ls -lh

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ExecTI ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/execti-x86_64.exe
            dist/execti-arm64.exe
            dist/execti-windows-x64-arm64.zip
            dist/SHA256SUMS.txt
